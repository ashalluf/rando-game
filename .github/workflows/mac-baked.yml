name: Mac build with baked shaders (manual, experimental)

# A SEPARATE, MANUAL workflow (mac-launch, docs/HANDOFF.md "The Mac launch"). It never runs on a
# push, and its failure can never block "Check and build" (the gate, the Mac app release, the web
# build and the Pages deploy stay there, unchanged).
#
# Godot's shader baker (export option shader_baker/enabled, Godot 4.5+) pre-builds the shaders
# into the .pck. Baking METAL needs: macOS with Apple's Metal toolchain, an editor running WITHOUT
# --headless (it needs a GPU RenderingDevice), and a Forward+ / Mobile project. So this job runs
# on a macOS runner (billed at ~10x a Linux minute) and exports without --headless.
#
# Not switched on by default because Godot 4.7.2's baked Metal exports abort on Apple Silicon:
# godotengine/godot#123266 (min_macos_version_arm64 under 14; 14.00 is the reported workaround)
# and #124539 ("Not enough bytes for uniform in shader container", also at 15.00). A crashed run
# leaves bad files in user://shader_cache that crash later builds too, until it is deleted. Run
# this only to test a Godot release that fixes them; its artifact is never released.

on:
  workflow_dispatch:
    inputs:
      min_macos:
        description: "application/min_macos_version_arm64 for the baked build (14.00 avoids godot#123266)"
        default: "14.00"
        required: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  mac-baked:
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }} (macOS editor) and the macOS template
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          unzip -oq -j templates.tpz templates/macos.zip templates/version.txt -d "$DEST"
          rm godot.zip templates.tpz

      - name: Metal toolchain
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Switch the baker on for this runner's copy of the preset
        run: |
          sed -i '' 's/^application\/min_macos_version_arm64=.*/application\/min_macos_version_arm64="${{ inputs.min_macos }}"/' export_presets.cfg
          if grep -q '^shader_baker/enabled' export_presets.cfg; then
            sed -i '' 's/^shader_baker\/enabled=.*/shader_baker\/enabled=true/' export_presets.cfg
          else
            # The first [preset.N.options] block is the macOS preset.
            awk 'BEGIN{d=0} /^\[preset\.[0-9]+\.options\]/ && !d {print; print "shader_baker/enabled=true"; d=1; next} {print}' export_presets.cfg > p.cfg && mv p.cfg export_presets.cfg
          fi
          grep -n "shader_baker\|min_macos_version_arm64" export_presets.cfg

      - name: "Import and export (not headless: the baker needs the GPU)"
        run: |
          GODOT="$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path . --import || true
          mkdir -p build
          "$GODOT" --path . --rendering-driver metal --export-release "macOS" build/RandoGame-macOS-baked.zip 2>&1 | tee build/export.log
          grep -E "Baking shaders|shader_baker|metal.cache" build/export.log | head -20 || true
          ls -la build

      - name: Upload the baked build (not released)
        uses: actions/upload-artifact@v4
        with:
          name: RandoGame-macOS-baked
          path: build/
          retention-days: 7
