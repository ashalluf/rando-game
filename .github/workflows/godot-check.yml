name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          rm godot.zip

      - name: Import and smoke test
        run: GODOT="$RUNNER_TEMP/godot" tests/headless_check.sh

      - name: Cache export templates
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-macos-web-${{ env.GODOT_VERSION }}

      - name: Download macOS and web export templates
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          unzip -oq -j templates.tpz templates/macos.zip templates/version.txt 'templates/web_*' -d "$DEST"
          rm templates.tpz

      - name: Export macOS app
        run: |
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --path . --export-release "macOS" build/RandoGame-macOS.zip
          ls -la build

      - name: Export web build
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload Mac build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandoGame-macOS
          path: build/RandoGame-macOS.zip

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandoGame-web
          path: build/web

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUBJECT="$(git log -1 --pretty=%s)"
          cat > notes.md <<NOTES
          **${SUBJECT}**

          Mac build of commit ${GITHUB_SHA::7}.

          How to play:
          1. Download **RandoGame-macOS.zip** below and open it. Safari unzips it for you.
          2. Double-click **Rando Game.app**.
          3. If macOS refuses to open it, go to System Settings, then Privacy & Security, scroll down and click **Open Anyway**, then open the app again. That is only needed once per download.

          Browser version (once the repo is public): https://ashalluf.github.io/rando-game/
          NOTES
          gh release create "build-${GITHUB_RUN_NUMBER}" build/RandoGame-macOS.zip \
            --title "Rando Game build ${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --latest

  deploy-web:
    # GitHub Pages needs a public repo on the free plan; this job is skipped while the repo is private.
    needs: check-and-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: RandoGame-web
          path: web

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
